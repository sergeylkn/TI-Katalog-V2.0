name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/workout-app-react-native-gk9bla
    paths:
      - "App.js"
      - "package.json"
      - "app.json"
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kettlebody-workout.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kettlebody-workout-apk
          path: kettlebody-workout.apk
          retention-days: 30
